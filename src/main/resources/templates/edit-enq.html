<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Enquiry - Marvellous Convent School</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.25) 0px, transparent 50%);
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #1e293b;
            margin: 0;
            padding-bottom: 2rem;
        }

        /* Glassmorphic Top Navbar */
        .glass-navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            padding: 0.75rem 1.5rem;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            color: #1e293b;
            font-size: 1.1rem;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: contain;
            background: #fff;
            padding: 2px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .nav-pills .nav-link {
            color: #64748b;
            font-weight: 600;
            border-radius: 10px;
            padding: 0.5rem 1rem;
            transition: all 0.2s ease;
        }

        .nav-pills .nav-link:hover {
            color: #6366f1;
            background: rgba(99, 102, 241, 0.08);
        }

        .nav-pills .nav-link.active {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: #fff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
        }

        .nav-pills .nav-link.logout-btn {
            color: #ef4444;
        }

        .nav-pills .nav-link.logout-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626;
        }

        /* Form Card Styling */
        .form-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .title {
            font-weight: 700;
            color: #1e293b;
            letter-spacing: -0.5px;
            font-size: 1.75rem;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-weight: 600;
            color: #475569;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .form-control, .form-select {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            border: 1.5px solid #e2e8f0;
            font-size: 0.95rem;
            color: #1e293b;
            transition: all 0.2s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .form-control[readonly] {
            background-color: #f1f5f9;
            color: #64748b;
            border-color: #e2e8f0;
            cursor: not-allowed;
        }

        .btn-primary {
            border-radius: 12px;
            padding: 0.8rem;
            font-weight: 600;
            font-size: 1rem;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border: none;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(99, 102, 241, 0.45);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Dynamic Feedback Alerts */
        .text-danger {
            font-weight: 500;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            background: #fef2f2;
            padding: 0.75rem;
            border-radius: 10px;
            border: 1px solid #fee2e2;
        }

        .text-success {
            font-weight: 500;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            background: #f0fdf4;
            padding: 0.75rem;
            border-radius: 10px;
            border: 1px solid #dcfce7;
            color: #15803d !important;
        }
    </style>
</head>

<body>

    <!-- Top Navigation Bar -->
    <nav class="glass-navbar mb-4">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <div class="navbar-brand">
                <img src="https://www.mcsghubaya.com/assets/logo-BsyZRetH.jpg" alt="MCS Logo" class="brand-logo">
                <span>Marvellous Convent School</span>
            </div>

            <ul class="nav nav-pills gap-1">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-grid-fill me-1"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/enquiry}"><i class="bi bi-person-plus-fill me-1"></i> Add Enquiry</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/view-enquiries}"><i class="bi bi-card-list me-1"></i> View Enquiries</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link logout-btn" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-1"></i> Logout</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="form-card">

                    <h3 class="text-center title mb-1">Edit Enquiry</h3>
                    <p class="text-center subtitle">Modify lead details and update status</p>

                    <!-- Alert Messages -->
                    <p th:if="${smsg}" class="text-success text-center" th:text="${smsg}"></p>
                    <p th:if="${emsg}" class="text-danger text-center" th:text="${emsg}"></p>
				<!-- 
                    <form th:action="@{/enquiry}" th:object="${enquiryDto}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Enquiry ID</label>
                            <input type="number" class="form-control" th:field="*{enqId}" readonly>
                        </div>
				 -->
				 <form th:action="@{/enquiry}" th:object="${enquiryDto}" method="post">

    <!-- CRITICAL FIX: Ensures enqId is populated in EnquiryDto on submit -->
    <input type="hidden" th:field="*{enqId}" />

    <div class="mb-3">
        <label class="form-label">Enquiry ID</label>
        <input type="number" class="form-control" th:field="*{enqId}" disabled>
    </div>
    ...
                        <div class="mb-3">
                            <label class="form-label">Student Name</label>
                            <input type="text" class="form-control" th:field="*{stuName}" placeholder="Enter name" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Student Phone</label>
                            <input type="tel" class="form-control" th:field="*{stuPhno}" placeholder="Enter phone number" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Training Mode</label>
                            <select class="form-select" th:field="*{classMode}">
                                <option value="">-Select Mode-</option>
                                <option value="Online">Online</option>
                                <option value="Classroom">Classroom</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Select Course</label>
                            <select class="form-select" th:field="*{courseId}">
                                <option value="">-Select Course-</option>
                                <option th:each="course : ${courses}" 
                                        th:value="${course.courseid}" 
                                        th:text="${course.coursename}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Enquiry Status</label>
                            <select class="form-select" th:field="*{enqStatus}" required>
                                <option value="">-Select Status-</option>
                                <option value="NEW">New</option>
                                <option value="ENROLLED">Enrolled</option>
                                <option value="LOST">Lost</option>
                            </select>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-arrow-repeat me-1"></i> Update Enquiry</button>
                        </div>

                    </form>

                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
