<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - Marvellous Convent School</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.25) 0px, transparent 50%);
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #1e293b;
            margin: 0;
            padding-bottom: 2rem;
        }

        /* Glassmorphic Top Navbar */
        .glass-navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            padding: 0.75rem 1.5rem;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            color: #1e293b;
            font-size: 1.1rem;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: contain;
            background: #fff;
            padding: 2px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .nav-pills .nav-link {
            color: #64748b;
            font-weight: 600;
            border-radius: 10px;
            padding: 0.5rem 1rem;
            transition: all 0.2s ease;
        }

        .nav-pills .nav-link:hover {
            color: #6366f1;
            background: rgba(99, 102, 241, 0.08);
        }

        .nav-pills .nav-link.active {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: #fff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
        }

        .nav-pills .nav-link.logout-btn {
            color: #ef4444;
        }

        .nav-pills .nav-link.logout-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626;
        }

        /* Dashboard Container & Title */
        .dashboard-container {
            max-width: 1100px;
        }

        .dashboard-header {
            color: #ffffff;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .dashboard-subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        /* Metric Cards */
        .metric-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            margin-bottom: 1rem;
        }

        .icon-total { background: rgba(99, 102, 241, 0.15); color: #6366f1; }
        .icon-new { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .icon-enrolled { background: rgba(14, 165, 233, 0.15); color: #0ea5e9; }
        .icon-lost { background: rgba(244, 63, 94, 0.15); color: #f43f5e; }

        .metric-title {
            color: #64748b;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.25rem;
        }

        .metric-value {
            font-weight: 700;
            font-size: 2.25rem;
            color: #0f172a;
            margin: 0;
            line-height: 1;
        }
    </style>
</head>

<body>

    <!-- Top Navigation Bar -->
    <nav class="glass-navbar mb-4">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <div class="navbar-brand">
                <img src="https://www.mcsghubaya.com/assets/logo-BsyZRetH.jpg" alt="MCS Logo" class="brand-logo">
                <span>Marvellous Convent School</span>
            </div>

            <ul class="nav nav-pills gap-1">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/dashboard}"><i class="bi bi-grid-fill me-1"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/enquiry}"><i class="bi bi-person-plus-fill me-1"></i> Add Enquiry</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/view-enquiries}"><i class="bi bi-card-list me-1"></i> View Enquiries</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link logout-btn" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-1"></i> Logout</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container dashboard-container mt-4">

        <!-- Title Header -->
        <div class="mb-4">
            <h3 class="dashboard-header"><i class="bi bi-speedometer2 me-2"></i>My Leads Dashboard</h3>
            <p class="dashboard-subtitle">Track and monitor your assigned enquiry statistics</p>
        </div>

        <!-- Metric Cards Grid -->
        <div class="row g-4">

            <!-- Total Enquiries -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="metric-card">
                    <div class="card-icon icon-total">
                        <i class="bi bi-folder-fill"></i>
                    </div>
                    <h6 class="metric-title">Total Enquiries</h6>
                    <h2 class="metric-value" th:text="${dashboardInfo.totalEnqs}">0</h2>
                </div>
            </div>

            <!-- New Enquiries -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="metric-card">
                    <div class="card-icon icon-new">
                        <i class="bi bi-star-fill"></i>
                    </div>
                    <h6 class="metric-title">New Enquiries</h6>
                    <h2 class="metric-value text-success" th:text="${dashboardInfo.newEnqs}">0</h2>
                </div>
            </div>

            <!-- Enrolled -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="metric-card">
                    <div class="card-icon icon-enrolled">
                        <i class="bi bi-check-circle-fill"></i>
                    </div>
                    <h6 class="metric-title">Enrolled</h6>
                    <h2 class="metric-value text-info" th:text="${dashboardInfo.enrolledEnqs}">0</h2>
                </div>
            </div>

            <!-- Lost -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="metric-card">
                    <div class="card-icon icon-lost">
                        <i class="bi bi-x-circle-fill"></i>
                    </div>
                    <h6 class="metric-title">Lost Enquiries</h6>
                    <h2 class="metric-value text-danger" th:text="${dashboardInfo.lostEnqs}">0</h2>
                </div>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
