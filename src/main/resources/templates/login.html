<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Marvellous Convent School</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.25) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 1.5rem;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 2.5rem 2rem 2rem 2rem;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            position: relative;
            margin-top: 40px;
        }

        .school-logo-container {
            width: 110px;
            height: 110px;
            margin: -80px auto 15px auto;
            background: #ffffff;
            border-radius: 50%;
            padding: 6px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border: 4px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .school-logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        .login-title {
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.25rem;
            color: #1e293b;
            letter-spacing: -0.5px;
            font-size: 1.75rem;
        }

        .login-subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-weight: 600;
            color: #475569;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .form-control {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            border: 1.5px solid #e2e8f0;
            font-size: 0.95rem;
            color: #1e293b;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .btn-primary {
            border-radius: 12px;
            padding: 0.8rem;
            font-weight: 600;
            font-size: 1rem;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border: none;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(99, 102, 241, 0.45);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .text-danger {
            font-weight: 500;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            background: #fef2f2;
            padding: 0.5rem;
            border-radius: 8px;
            border: 1px solid #fee2e2;
        }

        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #64748b;
        }

        .register-link a {
            text-decoration: none;
            font-weight: 600;
            color: #6366f1;
            transition: color 0.2s ease;
        }

        .register-link a:hover {
            color: #4f46e5;
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="school-logo-container">
        <img src="https://www.mcsghubaya.com/assets/logo-BsyZRetH.jpg" alt="Marvellous Convent School Logo">
    </div>

    <h3 class="login-title">Welcome Back</h3>
    <p class="login-subtitle">Sign in to your account</p>

    <!-- Error Message -->
    <!-- Render the element ONLY if an error exists -->
	<p th:if="${error}" class="text-danger text-center" th:text="${error}"></p>

    <form th:action="@{/login}" th:object="${counsellor}" method="post">

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}" placeholder="Enter email" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" th:field="*{pwd}" placeholder="Enter password" required>
        </div>

        <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary">Login</button>
        </div>

    </form>

    <div class="register-link">
        <span>Don't have an account? </span>
        <a href="register">Register</a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
