<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>View Enquiries - Marvellous Convent School</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.25) 0px, transparent 50%);
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #1e293b;
            margin: 0;
            padding-bottom: 2rem;
        }

        /* Glassmorphic Top Navbar */
        .glass-navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            padding: 0.75rem 1.5rem;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            color: #1e293b;
            font-size: 1.1rem;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: contain;
            background: #fff;
            padding: 2px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .nav-pills .nav-link {
            color: #64748b;
            font-weight: 600;
            border-radius: 10px;
            padding: 0.5rem 1rem;
            transition: all 0.2s ease;
        }

        .nav-pills .nav-link:hover {
            color: #6366f1;
            background: rgba(99, 102, 241, 0.08);
        }

        .nav-pills .nav-link.active {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: #fff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
        }

        .nav-pills .nav-link.logout-btn {
            color: #ef4444;
        }

        .nav-pills .nav-link.logout-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626;
        }

        /* Header Titles */
        .dashboard-header {
            color: #ffffff;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .dashboard-subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        /* Glassmorphic Cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .form-label {
            font-weight: 600;
            color: #475569;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .form-select {
            border-radius: 12px;
            padding: 0.65rem 1rem;
            border: 1.5px solid #e2e8f0;
            font-size: 0.95rem;
            color: #1e293b;
            transition: all 0.2s ease;
        }

        .form-select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .btn-primary {
            border-radius: 12px;
            padding: 0.65rem;
            font-weight: 600;
            font-size: 0.95rem;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border: none;
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.35);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.45);
        }

        /* Table Styling */
        .custom-table {
            margin-bottom: 0;
        }

        .custom-table thead th {
            background-color: #1e293b;
            color: #f8fafc;
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 1rem;
            border: none;
        }

        .custom-table tbody td {
            padding: 1rem;
            color: #334155;
            font-size: 0.95rem;
            border-bottom: 1px solid #f1f5f9;
        }

        /* Mode & Status Badges */
        .badge-mode {
            background-color: #e0e7ff;
            color: #4338ca;
            font-weight: 600;
            padding: 0.4em 0.8em;
            border-radius: 8px;
        }

        .badge-status-new {
            background-color: #dbeafe;
            color: #1d4ed8;
            font-weight: 600;
            padding: 0.4em 0.8em;
            border-radius: 8px;
        }

        .badge-status-enrolled {
            background-color: #dcfce7;
            color: #15803d;
            font-weight: 600;
            padding: 0.4em 0.8em;
            border-radius: 8px;
        }

        .badge-status-lost {
            background-color: #fee2e2;
            color: #b91c1c;
            font-weight: 600;
            padding: 0.4em 0.8em;
            border-radius: 8px;
        }

        .btn-edit {
            border-radius: 8px;
            font-weight: 600;
            padding: 0.35rem 0.85rem;
            color: #6366f1;
            border-color: #6366f1;
            transition: all 0.2s ease;
        }

        .btn-edit:hover {
            background-color: #6366f1;
            color: #ffffff;
        }
    </style>
</head>

<body>

    <!-- Top Navigation Bar -->
    <nav class="glass-navbar mb-4">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <div class="navbar-brand">
                <img src="https://www.mcsghubaya.com/assets/logo-BsyZRetH.jpg" alt="MCS Logo" class="brand-logo">
                <span>Marvellous Convent School</span>
            </div>

            <ul class="nav nav-pills gap-1">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-grid-fill me-1"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/enquiry}"><i class="bi bi-person-plus-fill me-1"></i> Add Enquiry</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/view-enquiries}"><i class="bi bi-card-list me-1"></i> View Enquiries</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link logout-btn" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-1"></i> Logout</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container mt-4">

        <!-- Title Header -->
        <div class="mb-4">
            <h3 class="dashboard-header"><i class="bi bi-people-fill me-2"></i>View My Leads</h3>
            <p class="dashboard-subtitle">Filter, search, and manage enquiry status details</p>
        </div>

        <!-- Filter Panel -->
        <div class="glass-card p-4 mb-4">
            <form th:action="@{/filter-enqs}" th:object="${filter}" method="post">
                <div class="row g-3 align-items-end">

                    <div class="col-12 col-md-3">
                        <label class="form-label">Class Mode</label>
                        <select class="form-select" th:field="*{classMode}">
                            <option value="">-Select Mode-</option>
                            <option value="Online">Online</option>
                            <option value="Classroom">Classroom</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-3">
                        <label class="form-label">Course</label>
                        <select class="form-select" th:field="*{courseId}">
                            <option value="">-Select Course-</option>
                            <option th:each="course : ${courses}" 
                                    th:value="${course.courseid}" 
                                    th:text="${course.coursename}">
                            </option>
                        </select>
                    </div>

                    <div class="col-12 col-md-3">
                        <label class="form-label">Status</label>
                        <select class="form-select" th:field="*{enqStatus}">
                            <option value="">-Select Status-</option>
                            <option value="NEW">New</option>
                            <option value="ENROLLED">Enrolled</option>
                            <option value="LOST">Lost</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-3 d-grid">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-funnel-fill me-1"></i> Apply Filter</button>
                    </div>

                </div>
            </form>
        </div>

        <!-- Enquiries Data Table Card -->
        <div class="glass-card p-3 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle custom-table">
                    <thead>
                    <tr>
                        <th class="text-center">#</th>
                        <th>Student Name</th>
                        <th>Phone</th>
                        <th>Course</th>
                        <th>Mode</th>
                        <th>Status</th>
                        <th class="text-center">Action</th>
                    </tr>
                    </thead>
                    <tbody>

                    <tr th:each="enq, loopCounter : ${enqs}">
                        <td class="text-center fw-bold text-muted" th:text="${loopCounter.index+1}"></td>
                        <td class="fw-semibold text-dark" th:text="${enq.stuName}"></td>
                        <td th:text="${enq.stuPhno}"></td>
                        <td th:text="${enq.course != null ? enq.course.coursename : 'N/A'}"></td>
                        <td>
                            <span class="badge badge-mode" th:text="${enq.classMode}"></span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${enq.enqStatus == 'NEW'} ? ' badge-status-new' : 
                                                 (${enq.enqStatus == 'ENROLLED'} ? ' badge-status-enrolled' : ' badge-status-lost')"
                                  th:text="${enq.enqStatus}">
                            </span>
                        </td>
                        <td class="text-center">
                            <a class="btn btn-sm btn-outline-primary btn-edit"
                               th:href="@{'/edit-enq?enqId='+${enq.enqId}}">
                                <i class="bi bi-pencil-square me-1"></i>Edit
                            </a>
                        </td>
                    </tr>

                    <!-- Empty State Fallback -->
                    <tr th:if="${enqs == null || enqs.size() == 0}">
                        <td colspan="7" class="text-center py-4 text-muted">
                            <i class="bi bi-inbox fs-2 d-block mb-1"></i>
                            No enquiry records found matching your selection
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
